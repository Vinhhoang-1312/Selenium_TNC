# ========================================
# 🏪 TNC STORE AUTOMATION CONFIGURATION
# ========================================

# 🌐 Application Settings
base.url=https://tncstore.vn
app.name=TNC Store

# 🔧 Browser Configuration
browser=chrome
headless=false

# ⏰ Timeout Settings
implicit.wait=15
explicit.wait=20
page.load.timeout=60
script.timeout=30

# 📸 Screenshot Settings
screenshot.on.failure=true
screenshot.path=target/screenshots

# 📊 Reporting Settings
extent.report.path=target/ExtentReport.html
allure.results.path=target/allure-results

# 🔐 Test Credentials (Demo accounts)
valid.email=testuser@tncstore.vn
valid.password=TestPassword123
invalid.email=invalid@test.com
invalid.password=wrongpassword

# 📱 Test Data
test.phone=0987654321
test.fullname=Nguyen Van Test
test.address=123 Test Street, Ho Chi Minh City

# 🏃‍♂️ Performance Settings
page.load.strategy=normal
element.highlight=false
retry.count=3

