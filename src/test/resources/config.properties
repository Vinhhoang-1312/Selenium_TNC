# Browser Configuration
browser=chrome
base.url=https://www.tncstore.vn/
headless.mode=false

# Timeouts (Increased for slow networks)
implicit.wait=15
explicit.wait=30
page.load.timeout=60

# Test Data
test.data.file=src/test/resources/testdata.json

# Report Configuration
report.path=target/ExtentReport.html
screenshot.path=target/screenshots/

# TNC Store specific URLs
login.url=https://www.tncstore.vn/account/login
register.url=https://www.tncstore.vn/account/register
profile.url=https://www.tncstore.vn/account/profile
cart.url=https://www.tncstore.vn/cart
checkout.url=https://www.tncstore.vn/checkout

# Test Environment
environment=QA
test.retry.count=1
