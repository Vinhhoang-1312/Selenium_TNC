name: Scheduled Tests - 3:10PM Daily

on:
# ... (triggers) ...

# BƯỚC THAY ĐỔI 1: THÊM QUYỀN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest

    steps:
      # ... (Các bước checkout, setup JDK, cache Maven) ...

      - name: Run Full Test Suite (testng.xml)
        run: mvn clean test -DsuiteXmlFile=testng.xml
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
      # ... (Các bước Upload Allure Results/Report) ...

      # BƯỚC THAY ĐỔI 2: THÊM BƯỚC TRIỂN KHAI
      - name: Deploy Scheduled Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: allure-pages-scheduled # Branch riêng cho Scheduled
          # Thêm thư mục con dựa trên số lần chạy để lưu trữ lịch sử báo cáo
          destination_dir: ${{ github.run_number }}
          allow_empty_commit: true

      # ... (Các bước Test Summary và Check Test Results) ...