name: Scheduled Tests - Daily Runs

on:
  schedule:
    - cron: '0 19 * * *'   # 2:00 AM VN (UTC+7)
    - cron: '0 21 * * *'   # 4:00 AM VN (UTC+7)
    - cron: '0 0 * * *'    # 7:00 AM VN (UTC+7)
    - cron: '0 7 * * *'    # 2:00 PM VN (UTC+7)
    - cron: '0 9 * * *'    # 4:00 PM VN (UTC+7)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scheduled-tests:
    name: Scheduled - Daily Test & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Full Test Suite
        run: mvn clean test -DsuiteXmlFile=testng.xml
        continue-on-error: true

      - name: Restore Allure History (for Trend)
        run: |
          git clone --depth=1 --single-branch --branch allure-pages-scheduled https://github.com/${{ github.repository }}.git gh-pages-scheduled || true
          if [ -d gh-pages-scheduled/history ]; then
            mkdir -p target/allure-results/history
            cp -a gh-pages-scheduled/history/. target/allure-results/history/ || true
            echo "Restored previous history from allure-pages-scheduled"
          else
            echo "No previous scheduled history found"
          fi

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Preserve Updated Allure History
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d target/site/allure-maven-plugin/history ]; then
            cp -r target/site/allure-maven-plugin/history/. target/allure-results/history/ || true
            echo "Preserved updated history for next scheduled run"
          fi

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-scheduled-${{ github.run_number }}
          path: target/allure-results
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-scheduled-${{ github.run_number }}
          path: target/site/allure-maven-plugin
          retention-days: 7

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: allure-pages-scheduled
          allow_empty_commit: true

      - name: Scheduled Test Summary
        if: always()
        run: |
          echo "### Scheduled Test Run - $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-pages-scheduled/)" >> $GITHUB_STEP_SUMMARY

  cd:
    name: CD - Deploy to Vercel (After Scheduled Tests)
    runs-on: ubuntu-latest
    needs: scheduled-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
          vercel-args: --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
