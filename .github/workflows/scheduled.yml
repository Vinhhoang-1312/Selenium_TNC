name: Scheduled Tests - 5:30PM & 2AM Daily

on:
  schedule:
    # Chạy mỗi ngày lúc 5h30 chiều giờ Việt Nam (UTC+7)
    # Cron sử dụng UTC nên 5h30 chiều VN = 10h30 sáng cùng ngày theo UTC
    - cron: '30 10 * * *'
    # Chạy mỗi ngày lúc 2h sáng giờ Việt Nam (UTC+7)
    # 2h sáng VN = 19h tối hôm trước theo UTC
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Full Test Suite (testng.xml)
        run: mvn clean test -DsuiteXmlFile=testng.xml
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-scheduled-${{ github.run_number }}
          path: target/allure-results
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-scheduled-${{ github.run_number }}
          path: target/site/allure-maven-plugin
          retention-days: 7

      - name: Deploy Scheduled Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: allure-pages-scheduled
          destination_dir: ${{ github.run_number }}
          allow_empty_commit: true

      - name: Test Summary
        if: always()
        run: |
          echo "### 🕐 Scheduled Test Run - $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is an automated test run to ensure the test suite is still working." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded Allure report artifact for detailed results." >> $GITHUB_STEP_SUMMARY

      # Optional: Send notification if tests fail
      - name: Check Test Results
        if: failure()
        run: |
          echo "::warning::Scheduled tests failed! Please check the test results."
