name: CI - Code Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ci:
    name: CI - Test & Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Smoke Test Suite (smoke-test.xml)
        run: mvn clean test -Psmoke-test
        continue-on-error: false

      - name: Prepare Allure Environment Info
        run: |
          echo "ENV=Production" > target/allure-results/environment.properties
          echo "BROWSER=Chrome" >> target/allure-results/environment.properties
          echo "BASE_URL=https://tnc-six.vercel.app" >> target/allure-results/environment.properties

      - name: Prepare Allure Executor Info
        run: |
          echo '{
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": 1,
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-pages-ci/"
          }' > target/allure-results/executor.json

      - name: Download Allure History from GitHub Pages branch
        run: |
          git clone --depth=1 --single-branch --branch allure-pages-ci https://github.com/${{ github.repository }}.git gh-pages-ci || true
          if [ -d gh-pages-ci/history ]; then
            mkdir -p target/allure-results/history
            cp -a gh-pages-ci/history/. target/allure-results/history/ || true
            echo "Copied history from gh-pages-ci/history to target/allure-results/history"
          else
            echo "No history found in gh-pages-ci/history"
          fi

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # 🔥 NEW: Preserve and Sync History for Allure Trend
      - name: Preserve Allure History
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d target/site/allure-maven-plugin/history ]; then
            cp -r target/site/allure-maven-plugin/history/. target/allure-results/history/ || true
            echo "Copied new history from report to allure-results"
          fi

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ci
          path: target/allure-results
          retention-days: 30

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-ci
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: allure-pages-ci
          allow_empty_commit: true

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded Allure report artifact for detailed results." >> $GITHUB_STEP_SUMMARY
