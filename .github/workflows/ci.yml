name: CI - Code Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# BƯỚC THAY ĐỔI 1: THÊM QUYỀN
permissions:
  contents: write # Cho phép action ghi/tạo branch mới
  pages: write    # Cho phép action quản lý GitHub Pages
  id-token: write # Cần thiết cho xác thực

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ... (Các bước checkout, setup JDK, cache Maven) ...

      - name: Run Smoke Test Suite (smoke-test.xml)
        run: mvn clean test -Psmoke-test
        continue-on-error: false

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # ... (Các bước Upload Allure Results/Report) ...

      # BƯỚC THAY ĐỔI 2: THÊM BƯỚC TRIỂN KHAI
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() # Luôn chạy để công bố báo cáo, kể cả khi kiểm thử fail
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin # Thư mục chứa báo cáo HTML
          publish_branch: allure-pages-ci # Tên branch mới để lưu trữ báo cáo
          allow_empty_commit: true
      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded Allure report artifact for detailed results." >> $GITHUB_STEP_SUMMARY