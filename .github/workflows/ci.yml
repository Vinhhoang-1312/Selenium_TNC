name: CI - Code Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ci:
    name: CI - Test & Report
    runs-on: ubuntu-latest
    outputs:
      test-result: ${{ steps.test-step.outcome }}

    steps:
      - name: Download Allure History Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: target/allure-results/history
        continue-on-error: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Download Allure History from GitHub Pages
        run: |
          echo "Fetching history from allure-pages-ci branch..."
          git clone --depth=1 --single-branch --branch allure-pages-ci https://github.com/${{ github.repository }}.git gh-pages-ci || echo "No existing allure-pages-ci branch found"

          if [ -d "gh-pages-ci/history" ]; then
            echo "History found, copying to allure-results..."
            mkdir -p target/allure-results/history
            cp -r gh-pages-ci/history/* target/allure-results/history/ 2>/dev/null || true
            echo "✅ History restored successfully"
            ls -la target/allure-results/history/ || true
          else
            echo "⚠️ No history found - this will be the first run"
            mkdir -p target/allure-results/history
          fi

          rm -rf gh-pages-ci

      - name: Prepare Allure Environment Info
        run: |
          mkdir -p target/allure-results
          cat > target/allure-results/environment.properties << EOF
          Environment=Production
          Browser=Chrome Headless
          Base.URL=https://tnc-allure-report.netlify.app
          Java.Version=${{ matrix.java || '21' }}
          OS=${{ runner.os }}
          Runner=GitHub Actions
          Workflow=${{ github.workflow }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Author=${{ github.actor }}
          Trigger=${{ github.event_name }}
          EOF
          echo "✅ Environment info prepared"

      - name: Prepare Allure Executor Info
        run: |
          cat > target/allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "CI Build #${{ github.run_number }} - $(date +'%Y-%m-%d_%H-%M-%S')",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}",
            "reportName": "Allure Report - CI"
          }
          EOF
          echo "✅ Executor info prepared"

      - name: Prepare Allure Categories
        run: |
          cat > target/allure-results/categories.json << 'EOF'
          [
            {
              "name": "Product defects",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*AssertionError.*"
            },
            {
              "name": "Test defects",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*Exception.*"
            },
            {
              "name": "Timeout issues",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*TimeoutException.*"
            },
            {
              "name": "Ignored tests",
              "matchedStatuses": ["skipped"]
            }
          ]
          EOF
          echo "✅ Categories configured"

      - name: Run Smoke Test Suite
        id: test-step
        run: mvn clean test -Psmoke-test
        continue-on-error: true

      - name: Check Allure Results Exist
        if: always()
        run: |
          echo "Checking if Allure results were generated..."
          if [ ! -d "target/allure-results" ]; then
            echo "❌ ERROR: target/allure-results directory does not exist!"
            echo "Tests may not have run properly."
            mkdir -p target/allure-results
            echo "Created empty directory to prevent build failure."
          elif [ -z "$(ls -A target/allure-results/*.json 2>/dev/null)" ]; then
            echo "⚠️ WARNING: No JSON result files found in target/allure-results!"
            echo "Tests may have failed to generate results."
          else
            echo "✅ Allure results found:"
            ls -lh target/allure-results/*.json | head -10
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          echo "Generating Allure report with history..."
          mvn allure:report
          echo "✅ Report generated at target/site/allure-maven-plugin"

      - name: Upload Allure History Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-history
          path: target/site/allure-maven-plugin/history
          retention-days: 30

      - name: Verify Allure Report Generated
        if: always()
        run: |
          echo "Verifying Allure report was generated properly..."
          if [ ! -f "target/site/allure-maven-plugin/index.html" ]; then
            echo "❌ ERROR: Allure report index.html not found!"
            echo "Report generation may have failed."
            exit 1
          fi

          REPORT_SIZE=$(du -sh target/site/allure-maven-plugin 2>/dev/null | cut -f1)
          echo "✅ Allure report generated successfully"
          echo "Report size: $REPORT_SIZE"
          echo "Files in report:"
          ls -lh target/site/allure-maven-plugin/ | head -15

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ci-${{ github.run_number }}
          path: target/allure-results
          retention-days: 30

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-ci-${{ github.run_number }}
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          publish_branch: allure-pages-ci
          keep_files: true # Đã đổi từ false thành true để giữ lại history
          enable_jekyll: false
          allow_empty_commit: true

      - name: Generate Test Summary
        if: always()
        run: |
          echo "# 📊 CI Test Results - Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [📈 View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY
          echo "- [📦 Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.test-step.outcome }}" == "success" ]; then
            echo "✅ **Status:** All smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Some tests failed - check the Allure report" >> $GITHUB_STEP_SUMMARY
          fi

  cd:
    name: CD - Deploy Allure Report to Netlify
    runs-on: ubuntu-latest
    needs: ci
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report-ci-${{ github.run_number }}
          path: allure-report

      - name: Verify Downloaded Report
        run: |
          echo "Verifying downloaded Allure report..."
          if [ ! -f "allure-report/index.html" ]; then
            echo "❌ ERROR: Downloaded report does not contain index.html!"
            echo "Cannot deploy to Netlify. Check CI job for report generation issues."
            exit 1
          fi

          REPORT_SIZE=$(du -sh allure-report 2>/dev/null | cut -f1)
          echo "✅ Report verified successfully"
          echo "Report size: $REPORT_SIZE"
          ls -lh allure-report/ | head -10

      - name: Deploy Allure Report to Netlify
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: "./allure-report"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Allure Report - Build #${{ github.run_number }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Deployment Summary
        run: |
          echo "# 🚀 Allure Report Deployed to Netlify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Allure Report deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** Netlify" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 View Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [📈 Netlify Report (Latest)](https://tnc-allure-report.netlify.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [📈 GitHub Pages Report (History)](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY
